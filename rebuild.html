<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵感重构 · AI 成图</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0eee9;color:#1e1b18;font-family:"Microsoft YaHei",sans-serif}.app{max-width:1280px;margin:auto;padding:28px 18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.head h1{font-size:22px;margin:0}.head p{color:#777;margin:4px 0 0;font-size:13px}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px}.panel,.preview{background:#fff;border:1px solid #dfdbd3;border-radius:16px;padding:20px}.panel label{display:block;font-size:12px;font-weight:700;margin:12px 0}.panel input,.panel textarea{width:100%;margin-top:6px;padding:10px;border:1px solid #ddd8cf;border-radius:8px;font:14px inherit}.panel textarea{height:58px}.upload{border:1.5px dashed #aaa39a;padding:18px;text-align:center;border-radius:10px}.upload input{border:0;padding:0}.go{width:100%;border:0;border-radius:9px;background:#20201d;color:#fff;padding:12px;font-weight:700;cursor:pointer}.status{font-size:12px;color:#6b655d;min-height:18px;margin:12px 0}.poster{position:relative;overflow:hidden;width:min(100%,620px);aspect-ratio:3/4;margin:auto;background:#fbf4e7}.poster img{width:100%;height:100%;object-fit:cover}.text{position:absolute;z-index:2;text-align:center;color:#101010;font-weight:900;text-shadow:0 2px #fff}.year{top:19%;left:5%;font-size:7.1vw}.year b{color:#f18e1b}.subject{top:12%;right:9%;font-size:8vw}.level{top:29%;left:39%;font-size:2.4vw;background:#fff7dc;border:1px solid #a9894e;border-radius:8px;padding:3px 14px;font-weight:500}.headline{top:37%;left:4%;right:4%;font-size:6.1vw;color:#ff991b;-webkit-text-stroke:.6vw #17120e;paint-order:stroke fill}.sub{top:50%;left:13%;right:13%;font-size:5.7vw;color:#bff2ff;-webkit-text-stroke:.5vw #111;paint-order:stroke fill}.benefits{bottom:4%;left:4%;right:4%;display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;color:#fff;font-size:4vw;-webkit-text-stroke:.45vw #111;paint-order:stroke fill}.benefits span:before{content:'✓';display:inline-grid;place-items:center;width:3.5vw;height:3.5vw;background:#2ecb48;border-radius:7px;margin-right:7px;font-size:2.6vw;-webkit-text-stroke:0}@media(max-width:800px){.grid{grid-template-columns:1fr}.year{font-size:10vw}.subject{font-size:12vw}.level{font-size:3.5vw}.headline{font-size:8.5vw}.sub{font-size:7.5vw}.benefits{font-size:5.5vw}.benefits span:before{width:5vw;height:5vw;font-size:4vw}}
</style>
<main class="app"><header class="head"><div><h1>灵感重构 · AI 成图</h1><p>AI 生成新背景，程序逐字保留确认后的文案。</p></div></header><section class="grid"><aside class="panel"><div class="upload"><label>上传有使用权的参考图<input id="file" type="file" accept="image/*"></label></div><label>主卖点<textarea id="headline">北师大版四上数学</textarea></label><label>副标题<textarea id="subtitle">全册备课包</textarea></label><label>版本文案<input id="year" value="2026秋版"></label><label>学科<input id="subject" value="数学"></label><label>年级<input id="level" value="四年级｜上册"></label><label>四个卖点（用｜分隔）<textarea id="benefits">全册教案｜课件PPT｜配套练习｜课堂笔记</textarea></label><button id="go" class="go">调用 n8n 生成新背景</button><div id="status" class="status">请上传图片后开始。</div></aside><section class="preview"><div class="poster"><img id="bg" src="assets/winter-math-background.png"><div class="text year" id="yearOut"></div><div class="text subject" id="subjectOut"></div><div class="text level" id="levelOut"></div><div class="text headline" id="headlineOut"></div><div class="text sub" id="subtitleOut"></div><div class="text benefits" id="benefitsOut"></div></div></section></section></main>
<script>
const $=id=>document.getElementById(id); const fields=['year','subject','level','headline','subtitle','benefits'];
function render(){fields.forEach(k=>{ if(k==='benefits') $('benefitsOut').innerHTML=$('benefits').value.split('｜').filter(Boolean).map(x=>`<span>${x}</span>`).join(''); else $(k+'Out').textContent=$(k).value;});} fields.forEach(k=>$(k).addEventListener('input',render));render();
$('go').addEventListener('click',async()=>{const file=$('file').files[0];if(!file){$('status').textContent='请先上传参考图。';return}if(file.size>8*1024*1024){$('status').textContent='图片请控制在 8MB 内。';return}$('go').disabled=true;$('status').textContent='正在交给 n8n 识图并生成新背景…';const imageData=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});try{const res=await fetch('/api/rebuild',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({imageData,copy:Object.fromEntries(fields.map(k=>[k,$(k).value])),mode:'preserve-copy-new-visual'})});const data=await res.json();if(!res.ok)throw Error(data.error||'生成失败');if(data.backgroundUrl)$('bg').src=data.backgroundUrl;if(data.copy){Object.entries(data.copy).forEach(([k,v])=>{if($(k))$(k).value=v});render()}$('status').textContent='背景已更新，文案已按确认内容逐字排版。'}catch(e){$('status').textContent=e.message}finally{$('go').disabled=false}})
</script>
