<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><style>body{margin:0;padding:22px;font-family:Arial,"Microsoft YaHei",sans-serif;color:#1f3028}h2{margin:0 0 8px;font-size:19px}p{font-size:13px;line-height:1.55;color:#66736b}label{display:block;font-size:12px;font-weight:bold;margin-top:16px}input{box-sizing:border-box;width:100%;padding:9px;margin-top:6px;border:1px solid #d6ddd8;border-radius:6px}button{margin-top:20px;width:100%;padding:11px;border:0;border-radius:6px;background:#20352d;color:#fff;font-weight:bold;cursor:pointer}#status{margin-top:13px;font-size:12px}</style></head><body><h2>导入 AI 设计任务</h2><p>将网页生成页中的“服务地址”和“任务 ID”粘贴到这里。插件会创建可继续编辑的 MasterGo 图层。</p><label>服务地址<input id="endpoint" placeholder="http://localhost:4178"/></label><label>任务 ID<input id="jobId" placeholder="粘贴任务 ID"/></label><button id="import">导入到当前画布</button><div id="status"></div><script>const status=document.querySelector('#status');document.querySelector('#import').onclick=async()=>{const endpoint=document.querySelector('#endpoint').value.replace(/\/$/,'');const jobId=document.querySelector('#jobId').value.trim();if(!endpoint||!jobId){status.textContent='请填写服务地址和任务 ID';return}try{status.textContent='正在获取素材…';const scene=await (await fetch(endpoint+'/api/jobs/'+jobId+'/scene')).json();if(scene.error)throw new Error(scene.error);for(const item of scene.elements){if(item.type==='image'&&item.url){const blob=await (await fetch(item.url)).blob();item.bytes=Array.from(new Uint8Array(await blob.arrayBuffer()));delete item.url}}parent.postMessage({pluginMessage:{type:'import-scene',scene}},'*');status.textContent='正在导入到画布…'}catch(error){status.textContent='失败：'+error.message}};window.onmessage=e=>{const msg=e.data.pluginMessage;if(!msg)return;if(msg.type==='success')status.textContent='导入完成，可以直接编辑文字和图片。';if(msg.type==='error')status.textContent='失败：'+msg.message}</script></body></html>
